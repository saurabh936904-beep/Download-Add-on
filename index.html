const CUSTOM_BOT_TOKEN =

   FIREBASE

firebase.initializeApp(

/* =====================================================
   GLOBAL
===================================================== */

let ALL_DATA = null;

let CURRENT_ITEM = null;

let CURRENT_ITEM_TOKEN = "";

let CURRENT_DOWNLOAD_TYPE = "";

let CURRENT_GET_REQUEST_ID = null;

let CUSTOMER_CHAT_LISTENER = null;

let CUSTOMER_CHAT_STARTED = false;


/* =====================================================
   USER SESSION
===================================================== */

function getSessionId(){

  let id =
  localStorage.getItem(
    "team_sniper_session"
  );

  if(!id){

    id =
    "TS-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2,9);

    localStorage.setItem(
      "team_sniper_session",
      id
    );

  }

  return id;

}


/* =====================================================
   USER DETAILS
===================================================== */

async function getUserDetails(){

  let ip = "Unknown";

  try{

    const response =
    await fetch(
      "https://api.ipify.org?format=json",
      {
        cache:"no-store"
      }
    );

    if(response.ok){

      const data =
      await response.json();

      ip =
      data.ip ||
      "Unknown";

    }

  }catch(e){}

  return {

    ip:ip,

    language:
    navigator.language ||
    "Unknown",

    platform:
    navigator.platform ||
    "Unknown",

    screen:
    window.screen.width +
    "x" +
    window.screen.height,

    userAgent:
    navigator.userAgent,

    session:
    getSessionId(),

    page:
    window.location.href

  };

}


/* =====================================================
   ONLINE DATE TIME
===================================================== */

async function getOnlineDateTime(){

  try{

    const response =
    await fetch(
      "https://worldtimeapi.org/api/timezone/Asia/Kolkata",
      {
        cache:"no-store"
      }
    );

    if(response.ok){

      const data =
      await response.json();

      if(data.datetime){

        const date =
        new Date(
          data.datetime
        );

        return formatDateTime(
          date
        );

      }

    }

  }catch(e){}

  return formatDateTime(
    new Date()
  );

}


/* =====================================================
   DATE FORMAT
===================================================== */

function padNumber(number){

  return String(number)
    .padStart(2,"0");

}


function formatDateTime(date){

  return (
    padNumber(date.getHours()) +
    ":" +
    padNumber(date.getMinutes()) +
    ":" +
    padNumber(date.getSeconds()) +
    " " +
    padNumber(date.getDate()) +
    "/" +
    padNumber(date.getMonth() + 1) +
    "/" +
    date.getFullYear()
  );

}


/* =====================================================
   CREATE REQUEST ID
===================================================== */

function createRequestId(){

  return (
    "REQ-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2,10)
  );

}


/* =====================================================
   FIREBASE SEND REQUEST
===================================================== */

async function sendFirebaseRequest(
  botType,
  message
){

  const requestId =
  createRequestId();

  await firebaseDB
    .ref(
      "Request/" +
      requestId
    )
    .set({

      type:"send",

      message:String(message),

      bot:botType,

      api:CUSTOM_BOT_TOKEN

    });

  return true;

}


/* =====================================================
   LOG MESSAGE
===================================================== */

async function sendLog(
  action,
  token,
  extra
){

  try{

    const time =
    await getOnlineDateTime();

    const user =
    await getUserDetails();

    let message = "";

    if(token){

      message +=
      "<" +
      token +
      "> ";

    }

    message += action;

    message +=
    "\n\nDate & Time: " +
    time;

    message +=
    "\nIP: " +
    user.ip;

    message +=
    "\nLanguage: " +
    user.language;

    message +=
    "\nPlatform: " +
    user.platform;

    message +=
    "\nScreen: " +
    user.screen;

    message +=
    "\nSession: " +
    user.session;

    message +=
    "\nPage: " +
    user.page;

    if(extra){

      message +=
      "\n" +
      extra;

    }

    await sendFirebaseRequest(
      "log",
      message
    );

  }catch(error){

    console.error(
      "Log send error:",
      error
    );

  }

}


/* =====================================================
   YOUTUBE ID
===================================================== */

function getYouTubeId(url){

  if(!url){
    return null;
  }

  try{

    const u =
    new URL(url);

    if(
      u.hostname.includes(
        "youtu.be"
      )
    ){

      return u.pathname
        .substring(1)
        .split("/")[0];

    }

    if(
      u.hostname.includes(
        "youtube.com"
      )
    ){

      if(
        u.pathname === "/watch"
      ){

        return u.searchParams.get("v");

      }

      if(
        u.pathname.startsWith(
          "/shorts/"
        )
      ){

        return u.pathname
          .split("/")[2];

      }

      if(
        u.pathname.startsWith(
          "/embed/"
        )
      ){

        return u.pathname
          .split("/")[2];

      }

    }

  }catch(e){}

  return null;

}


/* =====================================================
   DRIVE ID
===================================================== */

function getDriveId(url){

  if(!url){
    return null;
  }

  try{

    const match =
    url.match(
      /(?:\/d\/|id=)([a-zA-Z0-9_-]+)/
    );

    return match
      ? match[1]
      : null;

  }catch(e){

    return null;

  }

}


/* =====================================================
   MEDIA URL
===================================================== */

function mediaUrl(url){

  if(!url){
    return "";
  }

/* =====================================================
   VALUE HELPERS
===================================================== */

function getValue(
  item,
  key
){

  if(
    !item ||
    !Object.prototype.hasOwnProperty.call(
      item,
      key
    )
  ){

    return "";

  }

  return String(
    item[key] == null
      ? ""
      : item[key]
  );

}


/* =====================================================
   DATE VALUE
===================================================== */

function getTimestamp(value){

  if(
    !value ||
    String(value).trim() === ""
  ){

    return null;

  }

  const number =
  Number(value);

  if(
    !Number.isFinite(number)
  ){

    return null;

  }

  return number;

}


/* =====================================================
   ITEM EXPIRED
===================================================== */

function isExpired(item){

  const expire =
  getValue(
    item,
    "expire"
  );

  if(!expire){
    return false;
  }

  const timestamp =
  getTimestamp(expire);

  if(timestamp === null){
    return false;
  }

  return (
    Date.now() >= timestamp
  );

}


/* =====================================================
   ITEM SCHEDULED
===================================================== */

function isBeforeSchedule(item){

  const visible =
  getValue(
    item,
    "visible"
  );

  const timestamp =
  getTimestamp(visible);

  if(timestamp === null){
    return false;
  }

  return (
    Date.now() < timestamp
  );

}


/* =====================================================
   ACCESS CHECK
===================================================== */

function canOpenItem(item){

  if(!item){
    return false;
  }

  if(isExpired(item)){
    return false;
  }

  const visible =
  getValue(
    item,
    "visible"
  );

  if(
    visible === "Private"
  ){

    return false;

  }

  if(
    getTimestamp(visible) !== null
  ){

    if(
      isBeforeSchedule(item)
    ){

      return false;

    }

  }

  return true;

}


/* =====================================================
   SHOW IN MAIN LIST
===================================================== */

function shouldShowInList(item){

  if(
    !canOpenItem(item)
  ){

    return false;

  }

  const visible =
  getValue(
    item,
    "visible"
  );

  if(
    visible === "Unlisted"
  ){

    return false;

  }

  if(
    visible === "Private"
  ){

    return false;

  }

  return true;

}


/* =====================================================
   VISIBLE LABEL
===================================================== */

function getVisibleLabel(item){

  const visible =
  getValue(
    item,
    "visible"
  );

  if(!visible){
    return "Public";
  }

  if(
    visible === "Unlisted"
  ){

    return "Unlisted";

  }

  if(
    visible === "Private"
  ){

    return "Private";

  }

  const timestamp =
  getTimestamp(visible);

  if(timestamp !== null){

    if(
      Date.now() <
      timestamp
    ){

      return (
        "Scheduled • " +
        formatDateTime(
          new Date(timestamp)
        )
      );

    }

    return "Public";

  }

  return "Public";

}


/* =====================================================
   GET ITEMS
===================================================== */

function getItems(data){

  const result = [];

  const used =
  new Set();

  if(
    Array.isArray(
      data.listMap
    )
  ){

    data.listMap.forEach(
      function(item){

        if(
          !item ||
          !item.id
        ){

          return;

        }

        if(
          used.has(item.id)
        ){

          return;

        }

        used.add(item.id);

        result.push(item);

      }
    );

  }

  if(
    result.length === 0 &&
    data.main &&
    typeof data.main === "object"
  ){

    Object.keys(data.main)
      .forEach(
        function(id){

          const item =
          data.main[id];

          if(
            !item ||
            used.has(id)
          ){

            return;

          }

          used.add(id);

          result.push(item);

        }
      );

  }

  return result.reverse();

}


/* =====================================================
   SEARCH FILTER
===================================================== */

function filterItems(
  items,
  searchText
){

  const query =
  String(
    searchText || ""
  )
  .trim()
  .toLowerCase();

  if(!query){
    return items;
  }

  return items.filter(
    function(item){

      const title =
      String(
        item.title || ""
      ).toLowerCase();

      const token =
      String(
        item.token || ""
      ).toLowerCase();

      return (
        title.includes(query) ||
        token.includes(query)
      );

    }
  );

}

/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* =====================================================
   FIND BY ID
===================================================== */

function findItemById(
  data,
  id
){

  const items =
  getItems(data);

  for(
    let i = 0;
    i < items.length;
    i++
  ){

    if(
      String(items[i].id) ===
      String(id)
    ){

      return items[i];

    }

  }

  if(
    data.main &&
    data.main[id]
  ){

    return data.main[id];

  }

  return null;

}


/* =====================================================
   FIND BY TOKEN
===================================================== */

function findItemByToken(
  data,
  token
){

  const items =
  getItems(data);

  for(
    let i = 0;
    i < items.length;
    i++
  ){

    if(
      String(
        items[i].token
      ) ===
      String(token)
    ){

      return items[i];

    }

  }

  if(
    data.token &&
    data.token[token]
  ){

    return findItemById(
      data,
      data.token[token]
    );

  }

  return null;

}

    CUSTOMER_CHAT_STARTED &&
    CURRENT_GET_REQUEST_ID
  ){

    return;

  }

  CUSTOMER_CHAT_STARTED =
  true;

  const requestId =
  createRequestId();

  CURRENT_GET_REQUEST_ID =
  requestId;

  try{

    await firebaseDB
      .ref(
        "Request/" +
        requestId
      )
      .set({

        type:"get",

        bot:"message",

        api:CUSTOM_BOT_TOKEN

      });

    listenCustomerCareMessages(
      requestId
    );

  }catch(error){

    console.error(
      "Customer Care GET error:",
      error
    );

    CUSTOMER_CHAT_STARTED =
    false;

    CURRENT_GET_REQUEST_ID =
    null;

  }

}


/* =====================================================
   LISTEN SAME SUCCESS REQUEST
===================================================== */

function listenCustomerCareMessages(
  requestId
){

  if(CUSTOMER_CHAT_LISTENER){

    firebaseDB
      .ref(
        "successRequest/" +
        CUSTOMER_CHAT_LISTENER.requestId
      )
      .off(
        "value",
        CUSTOMER_CHAT_LISTENER.callback
      );

  }

  const ref =
  firebaseDB
    .ref(
      "successRequest/" +
      requestId
    );

  const callback =
  function(snapshot){

    const data =
    snapshot.val();

    if(!data){
      return;
    }

    let list = [];

    if(
      typeof data.messageList ===
      "string"
    ){

      try{

        list =
        JSON.parse(
          data.messageList
        );

      }catch(error){

        list = [];

      }

    }

    if(
      Array.isArray(
        data.messageList
      )
    ){

      list =
      data.messageList;

    }

    if(
      !Array.isArray(list)
    ){

      return;

    }

    renderCustomerCareMessages(
      list
    );

  };

  CUSTOMER_CHAT_LISTENER = {

    requestId:
    requestId,

    callback:
    callback

  };

  ref.on(
    "value",
    callback
  );

}


/* =====================================================
   RENDER CUSTOMER CARE MESSAGES
===================================================== */

function renderCustomerCareMessages(
  list
){

  const container =
  document.getElementById(
    "chatMessages"
  );

  container.innerHTML = "";

  let hasMessage =
  false;

  if(
    !Array.isArray(list)
  ){

    list = [];

  }

  list.forEach(
    function(item){

      if(
        !item ||
        !item.text
      ){

        return;

      }

      const text =
      String(item.text);

      /*
         User द्वारा Telegram को भेजे गए
         CUSTOMER CARE messages को admin reply
         के रूप में दोबारा मत दिखाओ।
      */

      if(
        text.indexOf(
          "💬 CUSTOMER CARE MESSAGE"
        ) === 0
      ){

        return;

      }

      hasMessage =
      true;

      let messageTime =
      "";

      if(item.date){

        const date =
        new Date(
          item.date
        );

        if(
          !Number.isNaN(
            date.getTime()
          )
        ){

          messageTime =
          formatDateTime(
            date
          );

        }

      }

      addChatMessage(
        "Customer Care",
        text,
        messageTime,
        "admin"
      );

    }
  );

  if(!hasMessage){

    container.innerHTML =
    '<div class="chat-empty">' +
    'Customer Care से संपर्क करने के लिए<br>' +
    'अपना नाम और message भेजें।' +
    '</div>';

  }

}


/* =====================================================
   LOAD JSON
===================================================== */

async function loadData(){

  const response =
  await fetch(
    DATA_URL,
    {
      method:"GET",
      cache:"no-store"
    }
  );

  if(!response.ok){

    throw new Error(
      "HTTP Error: " +
      response.status
    );

  }

  const data =
  await response.json();

  if(
    !data ||
    typeof data !== "object"
  ){

    throw new Error(
      "Invalid JSON"
    );

  }

  if(
    !Array.isArray(
      data.listMap
    )
  ){

    throw new Error(
      "listMap not found"
    );

  }

  if(
    typeof data.main !== "object"
  ){

    throw new Error(
      "main not found"
    );

  }

  if(
    typeof data.token !== "object"
  ){

    throw new Error(
      "token not found"
    );

  }

  return data;

}


/* =====================================================
   MAIN PAGE LOAD
===================================================== */

async function start(){

  try{

    const data =
    await loadData();

    ALL_DATA =
    data;

    const params =
    new URLSearchParams(
      window.location.search
    );

    const id =
    params.get("id");

    const token =
    params.get("s");

    if(id){

      renderPage2(
        data,
        "id",
        id
      );

      return;

    }

    if(token){

      renderPage2(
        data,
        "token",
        token
      );

      return;

    }

    sendLog(
      "Main Page Load",
      "",
      "Items in database: " +
      data.listMap.length
    );

    renderPage1(
      data
    );

  }catch(error){

    console.error(
      error
    );

    document.getElementById(
      "app"
    ).innerHTML =

    '<div class="error">' +

    '<h3>Something went wrong</h3>' +

    '<br>' +

    'JSON Load Error: ' +

    escapeHtml(
      error.message
    ) +

    '</div>';

  }

}

start();

</script>
