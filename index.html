<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Team Sniper™</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  color:#fff;

}

header{

}

.handle{

/* =====================================================
   HEADER TITLE + SEARCH BUTTON
===================================================== */

.title-search-row{
  width:min(100%,900px);
  margin:0 auto;
  padding:18px 14px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.page-title{
  font-size:22px;
  font-weight:800;
  color:#fff;
}


/* =====================================================
   SEARCH BUTTON
===================================================== */

.search-button{
  width:42px;
  height:42px;
  border:1px solid #333;
  border-radius:50%;
  background:#191919;
  color:#ffd700;
  font-size:21px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.search-button:hover{

  border-color:#ffd700;
}


/* =====================================================
   SEARCH BOX
===================================================== */

.search-box{
  width:min(100%,900px);
  margin:12px auto 0;
  padding:0 14px;
  display:none;
}

.search-box.active{
  display:block;
}

.search-input{
  width:100%;
  height:45px;
  border:1px solid #333;
  border-radius:10px;
  outline:none;
  background:#111;
  color:#fff;
  padding:0 14px;
  font-size:15px;
}

.search-input:focus{
  border-color:#ffd700;
}

.search-input::placeholder{
  color:#777;
}


/* =====================================================
   CONTAINER
===================================================== */

.container{

  margin:auto;
  padding:20px 14px 40px;
}

.loading{
  text-align:center;
  color:#aaa;
  padding:50px 10px;
}


/* =====================================================
   GRID
===================================================== */

.grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fill,minmax(170px,1fr));

  gap:16px;
}

.card{

  border:1px solid #292929;
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.card:hover{

}

.card img{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  display:block;
  background:#222;
}

.card-title{
  padding:13px;
  font-size:15px;
  font-weight:bold;
}

.back{
  display:inline-block;
  color:#aaa;
  margin-bottom:15px;
  cursor:pointer;
}

.detail{
  background:#111;
  border:1px solid #292929;
  border-radius:18px;
  overflow:hidden;
}

.detail-main-img{
  width:100%;
  max-height:500px;
  object-fit:cover;
  display:block;
  cursor:pointer;
}

.detail-content{
  padding:18px;
}

.title{
  font-size:25px;
  font-weight:800;
  margin-bottom:10px;
}

.description{
  color:#bbb;
  line-height:1.6;
  margin-bottom:20px;

}

.buttons{

  gap:10px;

.btn{

  border-radius:10px;
  padding:13px 20px;

  font-size:15px;
  cursor:pointer;

.download-green{
  background:#16a34a;
}

.download-red{

}

.how-download{
  background:#2563eb;
}

.how-download:hover{
  background:#1d4ed8;
}

.explore{
  background:#333;
}

.explore:hover{
  background:#444;
}


/* =====================================================
   STATUS
===================================================== */

.item-status{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.status-badge{
  padding:7px 10px;
  border-radius:8px;

  font-weight:bold;

.status-visible{
  color:#67E8A5;

.status-unlisted{
  color:#D6A84F;

}

.status-private{
  color:#FF7B8A;

.status-schedule{

}

.status-expire{

.screenshots img{

/* =====================================================

/* =====================================================
   YOUTUBE ID
===================================================== */

function getYouTubeId(url){

  if(!url) return null;

  try{

    const u =
    new URL(url);

    if(
      u.hostname.includes("youtu.be")
    ){

      return u.pathname
        .substring(1)
        .split("/")[0];

    }

    if(
      u.hostname.includes("youtube.com")
    ){

      if(
        u.pathname === "/watch"
      ){

        return u.searchParams.get("v");

      }

      if(
        u.pathname.startsWith("/shorts/")
      ){

        return u.pathname
          .split("/")[2];

      }

      if(
        u.pathname.startsWith("/embed/")
      ){

        return u.pathname
          .split("/")[2];

      }

    }

  }catch(e){}

  return null;

}


/* =====================================================
   DRIVE ID
===================================================== */

function getDriveId(url){

  if(!url) return null;

  try{

    const match =
    url.match(
      /(?:\/d\/|id=)([a-zA-Z0-9_-]+)/
    );

    return match
      ? match[1]
      : null;

  }catch(e){

    return null;

  }

}


/* =====================================================
   MEDIA URL
===================================================== */

function mediaUrl(url){

  if(!url) return "";

  const youtubeId =
    getYouTubeId(url);

  if(youtubeId){

    return (
      "https://i.ytimg.com/vi/" +
      youtubeId +
      "/maxresdefault.jpg"
    );

  }

  return url;

}


/* =====================================================
   DOWNLOAD URL
===================================================== */

function downloadUrl(url){

  if(!url) return "";

  const youtubeId =
    getYouTubeId(url);

  if(youtubeId){

    return (
      "https://i.ytimg.com/vi/" +
      youtubeId +
      "/maxresdefault.jpg"
    );

  }

  const driveId =
    getDriveId(url);

  if(driveId){

    return (
      "https://drive.usercontent.google.com/download?id=" +
      encodeURIComponent(driveId) +
      "&export=download&confirm=t"
    );

  }

  return url;

}

/* =====================================================
   ONLINE INDIA TIME
===================================================== */

async function getOnlineTime(){

  try{

    const response =
      await fetch(
        "https://worldtimeapi.org/api/timezone/Asia/Kolkata",
        {
          method:"GET",
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "Online time failed"
      );

    }

    const data =
      await response.json();

    ONLINE_NOW =
      new Date(data.datetime);

    return ONLINE_NOW;

  }catch(error){

    ONLINE_NOW =
      new Date();

    return ONLINE_NOW;

  }

}


/* =====================================================
   DATE FORMAT
   HH:mm:ss dd/MM/yyyy
===================================================== */

function formatDateTime(date){

  const d =
    date instanceof Date
    ? date
    : new Date(date);

  function pad(number){

    return String(number)
      .padStart(2,"0");

  }

  return (
    pad(d.getHours()) +
    ":" +
    pad(d.getMinutes()) +
    ":" +
    pad(d.getSeconds()) +
    " " +
    pad(d.getDate()) +
    "/" +
    pad(d.getMonth() + 1) +
    "/" +
    d.getFullYear()
  );

}


/* =====================================================
   USER DETAILS
===================================================== */

function getUserDetails(){

  return {

    userAgent:
      navigator.userAgent || "",

    language:
      navigator.language || "",

    languages:
      navigator.languages
      ? navigator.languages.join(", ")
      : "",

    platform:
      navigator.platform || "",

    timezone:
      Intl.DateTimeFormat()
        .resolvedOptions()
        .timeZone || "",

    screen:
      window.screen
      ? window.screen.width +
        "x" +
        window.screen.height
      : "",

    referrer:
      document.referrer || "Direct",

    url:
      window.location.href

  };

}

/* =====================================================
   ITEM ACCESS CONTROL
===================================================== */

function getItemStatus(item){

  const now =
    ONLINE_NOW
    ? ONLINE_NOW.getTime()
    : Date.now();


  /*
     visible key missing
     = Public
  */

  let visible = "";

  if(
    Object.prototype.hasOwnProperty.call(
      item,
      "visible"
    )
  ){

    visible =
      String(
        item.visible == null
        ? ""
        : item.visible
      ).trim();

  }


  /*
     expire key missing
     = No Expire
  */

  let expire = "";

  if(
    Object.prototype.hasOwnProperty.call(
      item,
      "expire"
    )
  ){

    expire =
      String(
        item.expire == null
        ? ""
        : item.expire
      ).trim();

  }


  /* =================================================
     EXPIRE
  ================================================= */

  let expired = false;

  if(expire !== ""){

    const expireTime =
      Number(expire);

    if(
      !isNaN(expireTime) &&
      now >= expireTime
    ){

      expired = true;

    }

  }


  if(expired){

    return {

      allowed:false,

      showInList:false,

      reason:"expired",

      visible:visible,

      expire:expire

    };

  }


  /* =================================================
     PRIVATE
  ================================================= */

  if(
    visible.toLowerCase() ===
    "private"
  ){

    return {

      allowed:false,

      showInList:false,

      reason:"private",

      visible:visible,

      expire:expire

    };

  }


  /* =================================================
     SCHEDULE
  ================================================= */

  if(
    visible !== "" &&
    !isNaN(Number(visible))
  ){

    const scheduleTime =
      Number(visible);


    if(
      now < scheduleTime
    ){

      return {

        allowed:false,

        showInList:false,

        reason:"scheduled",

        visible:visible,

        expire:expire

      };

    }


    /*
       Schedule time aa gaya.
       Ab Public ki tarah.
    */

    return {

      allowed:true,

      showInList:true,

      reason:"public",

      visible:visible,

      expire:expire

    };

  }


  /* =================================================
     UNLISTED
  ================================================= */

  if(
    visible.toLowerCase() ===
    "unlisted"
  ){

    return {

      allowed:true,

      showInList:false,

      reason:"unlisted",

      visible:visible,

      expire:expire

    };

  }


  /* =================================================
     PUBLIC
  ================================================= */

  return {

    allowed:true,

    showInList:true,

    reason:"public",

    visible:visible,

    expire:expire

  };

}


/* =====================================================
   GET ITEMS
   LATEST FIRST
===================================================== */

function getItems(data){

  const result = [];

  const used =
    new Set();


  if(
    Array.isArray(data.listMap)
  ){

    data.listMap.forEach(
      function(item){

        if(
          !item ||
          !item.id
        ){

          return;

        }


        if(
          used.has(item.id)
        ){

          return;

        }


        used.add(item.id);

        result.push(item);

      }
    );

  }


  if(
    result.length === 0 &&
    data.main &&
    typeof data.main === "object"
  ){

    Object.keys(data.main)
      .forEach(
        function(id){

          const item =
            data.main[id];


          if(
            !item ||
            used.has(id)
          ){

            return;

          }


          used.add(id);

          result.push(item);

        }
      );

  }


  /*
     Latest item sabse upar.
  */

  result.reverse();

  return result;

}


/* =====================================================
   SEARCH FILTER
===================================================== */

function filterItems(
  items,
  searchText
){

  const query =
    String(searchText || "")
      .trim()
      .toLowerCase();


  if(!query){

    return items;

  }


  return items.filter(
    function(item){

      /*
         Private / expired /
         scheduled item search me bhi nahi.
      */

      const status =
        getItemStatus(item);


      if(
        !status.showInList
      ){

        return false;

      }


      const title =
        String(
          item.title || ""
        ).toLowerCase();


      const token =
        String(
          item.token || ""
        ).toLowerCase();


      return (
        title.includes(query) ||
        token.includes(query)
      );

    }
  );

}


/* =====================================================
   RENDER SEARCH RESULT
===================================================== */

function renderSearchResults(
  searchText
){

  if(!ALL_DATA){

    return;

  }


  const items =
    getItems(ALL_DATA);


  const filtered =
    filterItems(
      items,
      searchText
    );


  renderItems(
    filtered,
    searchText
  );

}


/* =====================================================
   RENDER ITEM GRID
===================================================== */

function renderItems(
  items,
  searchText
){

  const app =
    document.getElementById("app");


  app.innerHTML = "";


  const visibleItems =
    items.filter(
      function(item){

        const status =
          getItemStatus(item);

        return status.showInList;

      }
    );


  if(
    visibleItems.length === 0
  ){

    const noResult =
      document.createElement("div");

    noResult.className =
      "no-result";


    if(searchText){

      noResult.innerHTML =
        'No result found for <strong>"' +
        escapeHtml(searchText) +
        '"</strong>';

    }else{

      noResult.textContent =
        "No public items found.";

    }


    app.appendChild(
      noResult
    );

    return;

  }


  const grid =
    document.createElement("div");

  grid.className =
    "grid";


  visibleItems.forEach(
    function(item){

      const card =
        document.createElement("div");

      card.className =
        "card";


      const img =
        document.createElement("img");


      img.src =
        mediaUrl(
          item.thumbnail
        );


      img.alt =
        item.title ||
        "Thumbnail";


      const title =
        document.createElement("div");


      title.className =
        "card-title";


      title.textContent =
        item.title ||
        "Untitled";


      card.appendChild(img);

      card.appendChild(title);


      card.addEventListener(
        "click",
        function(){

          if(
            !item.token
          ){

            return;

          }


          window.location.href =
            "?s=" +
            encodeURIComponent(
              item.token
            );

        }
      );


      grid.appendChild(card);

    }
  );


  app.appendChild(grid);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   PAGE 1
===================================================== */

function renderPage1(data){

  const app =
    document.getElementById("app");


  app.innerHTML = "";


  const items =
    getItems(data);


  if(
    items.length === 0
  ){

    app.innerHTML =

      'No items found.' +
      '</div>';

    return;

  }


  renderItems(
    items,
    ""
  );

/* =====================================================
   FIND ITEM BY ID
===================================================== */

function findItemById(
  data,
  id
){

  const items =
    getItems(data);


  for(
    let i = 0;
    i < items.length;
    i++
  ){

    if(
      items[i].id === id
    ){

      return items[i];

    }

  }


  if(
    data.main &&
    data.main[id]
  ){

    return data.main[id];

  }


  return null;

}


/* =====================================================
   FIND ITEM BY TOKEN
===================================================== */

function findItemByToken(
  data,
  token
){

  const items =
    getItems(data);


  for(
    let i = 0;
    i < items.length;
    i++
  ){

    if(
      items[i].token === token
    ){

      return items[i];

    }

  }


  if(
    data.token &&
    data.token[token]
  ){

    return findItemById(
      data,
      data.token[token]
    );

  }


  return null;

}


/* =====================================================
   STATUS TEXT
===================================================== */

function getVisibleText(
  status
){

  if(
    status.reason === "unlisted"
  ){

    return "● Unlisted";

  }


  if(
    status.visible === ""
  ){

    return "● Public";

  }


  if(
    status.visible.toLowerCase() ===
    "private"
  ){

    return "● Private";

  }


  if(
    !isNaN(Number(status.visible))
  ){

    return (
      "● Schedule: " +
      formatDateTime(
        Number(status.visible)
      )
    );

  }


  return "● " + status.visible;

}


/* =====================================================
   EXPIRE TEXT
===================================================== */

function getExpireText(
  status
){

  if(
    status.expire === ""
  ){

    return "♾ No Expire";

  }


  if(
    !isNaN(Number(status.expire))
  ){

    return (
      "⌛ Expire: " +
      formatDateTime(
        Number(status.expire)
      )
    );

  }


  return "⌛ " + status.expire;

}


/* =====================================================
   PAGE 2
===================================================== */

function renderPage2(
  data,
  type,
  value
){

  const app =
    document.getElementById("app");


  let item = null;

  let isTokenLink =
    false;


  if(
    type === "id"
  ){

    item =
      findItemById(
        data,
        value
      );

  }


  if(
    type === "token"
  ){

    item =
      findItemByToken(
        data,
        value
      );

    isTokenLink =
      true;

  }


  if(!item){

    renderPage1(data);

    return;

  }


  /* =================================================
     ACCESS CONTROL
  ================================================= */

  const status =
    getItemStatus(item);


  if(
    !status.allowed
  ){

    app.innerHTML =
      '<div class="error">' +

      '<h3>Item Not Available</h3>' +

      '<br>' +

      'This item is currently unavailable.' +

      '</div>';

    return;

  }


  app.innerHTML = "";


  /* =================================================
     TELEGRAM ITEM PAGE LOAD
  ================================================= */

  sendUserLog(
    "Page Load",
    item.token || "",
    ""
  );


  /* =================================================
     BACK
  ================================================= */

  const back =
    document.createElement("div");


  back.className =
    "back";


  back.textContent =
    "← Explore";


  back.onclick =
    function(){

      window.location.href =
        window.location.pathname;

    };


  app.appendChild(back);


  /* =================================================
     DETAIL
  ================================================= */

  const detail =
    document.createElement("div");


  detail.className =
    "detail";


  /* =================================================
     MAIN IMAGE
  ================================================= */

  const mainImg =
    document.createElement("img");


  mainImg.className =
    "detail-main-img";


  mainImg.src =
    mediaUrl(
      item.thumbnail
    );


  mainImg.alt =
    item.title ||
    "Thumbnail";


  mainImg.onclick =
    function(){

      if(
        item.Vlink
      ){

        window.open(
          item.Vlink,
          "_blank"
        );

      }

    };


  detail.appendChild(
    mainImg
  );


  /* =================================================
     CONTENT
  ================================================= */

  const content =
    document.createElement("div");


  content.className =
    "detail-content";


  /* =================================================
     STATUS
  ================================================= */

  const statusRow =
    document.createElement("div");


  statusRow.className =
    "item-status";


  const visibleBadge =
    document.createElement("span");


  visibleBadge.className =
    "status-badge";


  if(
    status.visible === ""
  ){

    visibleBadge.classList.add(
      "status-visible"
    );

  }else if(
    status.visible.toLowerCase() ===
    "unlisted"
  ){

    visibleBadge.classList.add(
      "status-unlisted"
    );

  }else if(
    status.visible.toLowerCase() ===
    "private"
  ){

    visibleBadge.classList.add(
      "status-private"
    );

  }else{

    visibleBadge.classList.add(
      "status-schedule"
    );

  }


  visibleBadge.textContent =
    getVisibleText(status);


  const expireBadge =
    document.createElement("span");


  expireBadge.className =
    "status-badge";


  if(
    status.expire === ""
  ){

    expireBadge.classList.add(
      "status-noexpire"
    );

  }else{

    expireBadge.classList.add(
      "status-expire"
    );

  }


  expireBadge.textContent =
    getExpireText(status);


  statusRow.appendChild(
    visibleBadge
  );

  statusRow.appendChild(
    expireBadge
  );


  content.appendChild(
    statusRow
  );


  /* =================================================
     TITLE
  ================================================= */

  const title =
    document.createElement("div");


  title.className =
    "title";


  title.textContent =
    item.title ||
    "Untitled";


  /* =================================================
     DESCRIPTION
  ================================================= */

  const description =
    document.createElement("div");


  description.className =
    "description";


  description.textContent =
    item.description ||
    "";


  /* =================================================
     BUTTONS
  ================================================= */

  const buttons =
    document.createElement("div");


  buttons.className =
    "buttons";


  /* =================================================
     DOWNLOAD
  ================================================= */

  const download =
    document.createElement("a");


  if(
    isTokenLink
  ){

    download.className =
      "btn download-red";

    download.textContent =
      "Download Now";

    download.href =
      downloadUrl(
        item.Slink
      );

  }else{

    download.className =
      "btn download-green";

    download.textContent =
      "Download Now";

    download.href =
      downloadUrl(
        item.link
      );

  }


  download.target =
    "_blank";


  download.rel =
    "noopener";


  download.addEventListener(
    "click",
    function(){

      sendUserLog(
        "Download Button Click",
        item.token || "",
        isTokenLink
          ? "RED"
          : "GREEN"
      );

    }
  );


  buttons.appendChild(
    download
  );


  /* =================================================
     HOW TO DOWNLOAD
  ================================================= */

  const howDownload =
    document.createElement("a");


  howDownload.className =
    "btn how-download";


  howDownload.textContent =
    "How to Download";


  let howToLink =
    DEFAULT_HLINK;


  if(
    typeof item.Hlink === "string" &&
    item.Hlink.trim() !== ""
  ){

    howToLink =
      item.Hlink.trim();

  }


  howDownload.href =
    howToLink;


  howDownload.target =
    "_blank";


  howDownload.rel =
    "noopener";


  howDownload.addEventListener(
    "click",
    function(){

      sendUserLog(
        "How To Download Click",
        item.token || "",
        ""
      );

    }
  );


  buttons.appendChild(
    howDownload
  );


  /* =================================================
     EXPLORE
  ================================================= */

  const explore =
    document.createElement("a");


  explore.className =
    "btn explore";


  explore.textContent =
    "Explore";


  explore.href =
    window.location.pathname;


  buttons.appendChild(
    explore
  );


  /* =================================================
     APPEND
  ================================================= */

  content.appendChild(
    title
  );

  content.appendChild(
    description
  );

  content.appendChild(
    buttons
  );


  /* =================================================
     SCREENSHOTS
  ================================================= */

  if(
    Array.isArray(
      item.screenshot
    ) &&
    item.screenshot.length > 0
  ){

    const screenshotTitle =
      document.createElement("div");


    screenshotTitle.className =
      "screenshots-title";


    screenshotTitle.textContent =
      "Screenshots";


    const screenshots =
      document.createElement("div");


    screenshots.className =
      "screenshots";


    item.screenshot.forEach(
      function(url){

        const img =
          document.createElement("img");


        img.src =
          mediaUrl(url);


        img.alt =
          "Screenshot";


        screenshots.appendChild(
          img
        );

      }
    );


    content.appendChild(
      screenshotTitle
    );


    content.appendChild(
      screenshots
    );

  }


  detail.appendChild(
    content
  );


  app.appendChild(
    detail
  );

}

function toggleSearch(){

  const searchBox =
    document.getElementById(
      "searchBox"
    );


  const searchInput =
    document.getElementById(
      "searchInput"
    );


  searchBox.classList.toggle(
    "active"
  );


  if(
    searchBox.classList.contains(
      "active"
    )
  ){

    searchInput.focus();

  }else{

    searchInput.value = "";


    if(ALL_DATA){

      renderPage1(
        ALL_DATA
      );

    }

  }

}

/* =====================================================
   LOAD JSON
===================================================== */

async function loadData(){

  const response =
    await fetch(
      DATA_URL,
      {
        method:"GET",
        cache:"no-store"
      }
    );


  if(!response.ok){

    throw new Error(
      "HTTP Error: " +
      response.status
    );

  }


  const data =
    await response.json();


  if(
    !data ||
    typeof data !== "object"
  ){

    throw new Error(
      "Invalid JSON"
    );

  }


  if(
    !Array.isArray(
      data.listMap
    )
  ){

    throw new Error(
      "listMap not found"
    );

  }


  if(
    typeof data.main !== "object"
  ){

    throw new Error(
      "main not found"
    );

  }


  if(
    typeof data.token !== "object"
  ){

    throw new Error(
      "token not found"
    );

  }


  return data;

}


/* =====================================================
   START
===================================================== */

async function start(){

  try{

    /*
       Pehle online India time
    */

    await getOnlineTime();


    /*
       JSON load
    */

    const data =
      await loadData();


    ALL_DATA =
      data;


    console.log(
      "Total listMap items:",
      data.listMap.length
    );


    const params =
      new URLSearchParams(
        window.location.search
      );


    const id =
      params.get("id");


    const token =
      params.get("s");


    /* =================================================
       DIRECT ID PAGE
    ================================================= */

    if(id){

      renderPage2(
        data,
        "id",
        id
      );

      return;

    }


    /* =================================================
       TOKEN PAGE
    ================================================= */

    if(token){

      renderPage2(
        data,
        "token",
        token
      );

      return;

    }


    /* =================================================
       MAIN PAGE
    ================================================= */

    sendUserLog(
      "Main Page Load",
      "",
      ""
    );


    renderPage1(
      data
    );


  }catch(error){

    console.error(error);


    document.getElementById(
      "app"
    ).innerHTML =

      '<div class="error">' +

      '<h3>Something went wrong</h3>' +

      '<br>' +

      'JSON Load Error: ' +

      escapeHtml(
        error.message
      ) +

      '</div>';

  }

}


start();
