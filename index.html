<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>Team✓Sniper™</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080808;
  color:#fff;
  min-height:100vh;
}

header{
  padding:22px 16px;
  text-align:center;
  border-bottom:1px solid #252525;
  background:linear-gradient(180deg,#151515,#090909);
}

.brand{
  color:#ffd700;
  font-size:28px;
  font-weight:800;
  cursor:pointer;
}

.handle{
  color:#888;
  margin-top:5px;
  font-size:14px;
}

.container{
  width:min(100%,900px);
  margin:auto;
  padding:20px 14px 40px;
}

.loading{
  text-align:center;
  color:#aaa;
  padding:50px 10px;
}

.grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fill,minmax(170px,1fr));

  gap:16px;
}

.card{
  background:#111;
  border:1px solid #292929;
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#ffd700;
}

.card img{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  display:block;
  background:#222;
}

.card-title{
  padding:13px;
  font-size:15px;
  font-weight:bold;
}

.back{
  display:inline-block;
  color:#aaa;
  margin-bottom:15px;
  cursor:pointer;
}

.detail{
  background:#111;
  border:1px solid #292929;
  border-radius:18px;
  overflow:hidden;
}

.detail-main-img{
  width:100%;
  max-height:500px;
  object-fit:cover;
  display:block;
  cursor:pointer;
}

.detail-content{
  padding:18px;
}

.title{
  font-size:25px;
  font-weight:800;
  margin-bottom:10px;
}

.description{
  color:#bbb;
  line-height:1.6;
  margin-bottom:20px;
  white-space:pre-wrap;
}

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  border-radius:10px;
  padding:13px 20px;
  color:#fff;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
}

.download-green{
  background:#16a34a;
}

.download-red{
  background:#dc2626;
}


/* =====================================================
   HOW TO DOWNLOAD BUTTON
===================================================== */

.how-download{
  background:#2563eb;
}

.how-download:hover{
  background:#1d4ed8;
}


/* =====================================================
   EXPLORE
===================================================== */

.explore{
  background:#333;
}

.explore:hover{
  background:#444;
}


/* =====================================================
   SCREENSHOTS
===================================================== */

.screenshots-title{
  margin:25px 0 12px;
  font-size:19px;
}

.screenshots{
  display:grid;
  grid-template-columns:
  repeat(auto-fill,minmax(150px,1fr));

  gap:12px;
}

.screenshots img{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  border-radius:10px;
  background:#222;
}

.error{
  text-align:center;
  color:#ff5555;
  padding:50px 10px;
  line-height:1.6;
}


@media(max-width:500px){

  .grid{
    grid-template-columns:
    repeat(2,1fr);

    gap:10px;
  }

  .card-title{
    font-size:14px;
  }

  .title{
    font-size:21px;
  }

}

</style>

</head>


<body>


<header>

  <div
    class="brand"
    onclick="openChannel()">

    Team✓Sniper™

  </div>

  <div class="handle">
    @teamsniper450
  </div>

</header>


<div
  class="container"
  id="app">

  <div class="loading">
    Loading...
  </div>

</div>


<script>


/* =====================================================
   GITHUB GIST RAW JSON
===================================================== */

const DATA_URL = 
"https://gist.githubusercontent.com/saurabh936904-beep/73067a85d4c453239c89d4f67a76ea7f/raw/database.json?v=" + new Date().getTime();


/* =====================================================
   DEFAULT HOW TO DOWNLOAD VIDEO
===================================================== */

const DEFAULT_HLINK =
"https://youtu.be/LM6_fEaCjyY";


/* =====================================================
   YOUTUBE ID
===================================================== */

function getYouTubeId(url){

  if(!url) return null;

  try{

    const u =
    new URL(url);


    if(
      u.hostname.includes("youtu.be")
    ){

      return u.pathname
      .substring(1)
      .split("/")[0];

    }


    if(
      u.hostname.includes("youtube.com")
    ){

      if(
        u.pathname === "/watch"
      ){

        return u.searchParams.get("v");

      }


      if(
        u.pathname.startsWith("/shorts/")
      ){

        return u.pathname
        .split("/")[2];

      }


      if(
        u.pathname.startsWith("/embed/")
      ){

        return u.pathname
        .split("/")[2];

      }

    }

  }catch(e){}

  return null;

}


/* =====================================================
   DRIVE ID
===================================================== */

function getDriveId(url){

  if(!url) return null;

  try{

    const match =
    url.match(
      /(?:\/d\/|id=)([a-zA-Z0-9_-]+)/
    );

    return match
    ? match[1]
    : null;

  }catch(e){

    return null;

  }

}


/* =====================================================
   MEDIA URL
===================================================== */

function mediaUrl(url){

  if(!url) return "";

  const youtubeId =
  getYouTubeId(url);


  if(youtubeId){

    return (
      "https://i.ytimg.com/vi/" +
      youtubeId +
      "/maxresdefault.jpg"
    );

  }


  return url;

}


/* =====================================================
   DOWNLOAD URL
===================================================== */

function downloadUrl(url){

  if(!url) return "";

  const youtubeId =
  getYouTubeId(url);


  if(youtubeId){

    return (
      "https://i.ytimg.com/vi/" +
      youtubeId +
      "/maxresdefault.jpg"
    );

  }


  const driveId =
  getDriveId(url);


  if(driveId){

    return (
      "https://drive.usercontent.google.com/download?id=" +
      encodeURIComponent(driveId) +
      "&export=download&confirm=t"
    );

  }


  return url;

}


/* =====================================================
   CHANNEL
===================================================== */

function openChannel(){

  window.location.href =
  "https://youtube.com/@teamsniper450";

}


/* =====================================================
   GET ITEMS
===================================================== */

function getItems(data){

  /*
     IMPORTANT:

     listMap = actual item list

     main = lookup only

     Duplicate IDs removed.
  */

  const result = [];

  const used =
  new Set();


  if(
    Array.isArray(data.listMap)
  ){

    data.listMap.forEach(
      function(item){

        if(
          !item ||
          !item.id
        ){

          return;

        }


        if(
          used.has(item.id)
        ){

          return;

        }


        used.add(item.id);

        result.push(item);

      }
    );

  }


  /*
     Agar listMap empty ho,
     tab main se items lenge.
  */

  if(
    result.length === 0 &&
    data.main &&
    typeof data.main === "object"
  ){

    Object.keys(data.main)
    .forEach(
      function(id){

        const item =
        data.main[id];


        if(
          !item ||
          used.has(id)
        ){

          return;

        }


        used.add(id);

        result.push(item);

      }
    );

  }


  return result;

}


/* =====================================================
   PAGE 1
===================================================== */

function renderPage1(data){

  const app =
  document.getElementById("app");


  app.innerHTML = "";


  const items =
  getItems(data);


  if(items.length === 0){

    app.innerHTML =
    '<div class="error">' +
    'No items found.' +
    '</div>';

    return;

  }


  const grid =
  document.createElement("div");

  grid.className =
  "grid";


  items.forEach(
    function(item){

      const card =
      document.createElement("div");

      card.className =
      "card";


      const img =
      document.createElement("img");


      img.src =
      mediaUrl(
        item.thumbnail
      );


      img.alt =
      item.title ||
      "Thumbnail";


      const title =
      document.createElement("div");

      title.className =
      "card-title";


      title.textContent =
      item.title ||
      "Untitled";


      card.appendChild(img);

      card.appendChild(title);


      /*
         ONLY TOKEN

         ?s=TOKEN
      */

      card.addEventListener(
        "click",
        function(){

          if(
            !item.token
          ){

            return;

          }


          window.location.href =
          "?s=" +
          encodeURIComponent(
            item.token
          );

        }
      );


      grid.appendChild(card);

    }
  );


  app.appendChild(grid);

}


/* =====================================================
   FIND ITEM BY ID
===================================================== */

function findItemById(
  data,
  id
){

  const items =
  getItems(data);


  for(
    let i = 0;
    i < items.length;
    i++
  ){

    if(
      items[i].id === id
    ){

      return items[i];

    }

  }


  /*
     main lookup fallback
  */

  if(
    data.main &&
    data.main[id]
  ){

    return data.main[id];

  }


  return null;

}


/* =====================================================
   FIND ITEM BY TOKEN
===================================================== */

function findItemByToken(
  data,
  token
){

  const items =
  getItems(data);


  for(
    let i = 0;
    i < items.length;
    i++
  ){

    if(
      items[i].token === token
    ){

      return items[i];

    }

  }


  /*
     token map fallback
  */

  if(
    data.token &&
    data.token[token]
  ){

    return findItemById(
      data,
      data.token[token]
    );

  }


  return null;

}


/* =====================================================
   PAGE 2
===================================================== */

function renderPage2(
  data,
  type,
  value
){

  const app =
  document.getElementById("app");


  let item = null;

  let isTokenLink =
  false;


  /* ===================================================
     ?id=ID
  =================================================== */

  if(
    type === "id"
  ){

    item =
    findItemById(
      data,
      value
    );

  }


  /* ===================================================
     ?s=TOKEN
  =================================================== */

  if(
    type === "token"
  ){

    item =
    findItemByToken(
      data,
      value
    );


    isTokenLink =
    true;

  }


  /*
     Invalid ID/TOKEN
     → PAGE 1
  */

  if(!item){

    renderPage1(data);

    return;

  }


  app.innerHTML = "";


  /* ===================================================
     BACK / EXPLORE
  =================================================== */

  const back =
  document.createElement("div");

  back.className =
  "back";

  back.textContent =
  "← Explore";


  back.onclick =
  function(){

    window.location.href =
    window.location.pathname;

  };


  app.appendChild(back);


  /* ===================================================
     DETAIL
  =================================================== */

  const detail =
  document.createElement("div");

  detail.className =
  "detail";


  /* ===================================================
     THUMBNAIL
  =================================================== */

  const mainImg =
  document.createElement("img");

  mainImg.className =
  "detail-main-img";


  mainImg.src =
  mediaUrl(
    item.thumbnail
  );


  mainImg.alt =
  item.title ||
  "Thumbnail";


  mainImg.onclick =
  function(){

    if(
      item.Vlink
    ){

      window.open(
        item.Vlink,
        "_blank"
      );

    }

  };


  detail.appendChild(
    mainImg
  );


  /* ===================================================
     CONTENT
  =================================================== */

  const content =
  document.createElement("div");

  content.className =
  "detail-content";


  /* ===================================================
     TITLE
  =================================================== */

  const title =
  document.createElement("div");

  title.className =
  "title";

  title.textContent =
  item.title ||
  "Untitled";


  /* ===================================================
     DESCRIPTION
  =================================================== */

  const description =
  document.createElement("div");

  description.className =
  "description";

  description.textContent =
  item.description ||
  "";


  /* ===================================================
     BUTTONS
  =================================================== */

  const buttons =
  document.createElement("div");

  buttons.className =
  "buttons";


  /* ===================================================
     DOWNLOAD BUTTON
  =================================================== */

  const download =
  document.createElement("a");


  /*
     ?s=TOKEN
     → Slink = RED

     ?id=ID
     → link = GREEN
  */

  if(
    isTokenLink
  ){

    download.className =
    "btn download-red";


    download.textContent =
    "Download Now";


    download.href =
    downloadUrl(
      item.Slink
    );

  }else{

    download.className =
    "btn download-green";


    download.textContent =
    "Download Now";


    download.href =
    downloadUrl(
      item.link
    );

  }


  download.target =
  "_blank";


  download.rel =
  "noopener";


  buttons.appendChild(
    download
  );


  /* ===================================================
     HOW TO DOWNLOAD BUTTON
     
     Hlink available:
     → Hlink open

     Hlink empty:
     → Default video open

     Hlink missing:
     → Default video open
  =================================================== */

  const howDownload =
  document.createElement("a");


  howDownload.className =
  "btn how-download";


  howDownload.textContent =
  "How to Download";


  let howToLink =
    DEFAULT_HLINK;


  if(
    typeof item.Hlink === "string" &&
    item.Hlink.trim() !== ""
  ){

    howToLink =
    item.Hlink.trim();

  }


  howDownload.href =
  howToLink;


  howDownload.target =
  "_blank";


  howDownload.rel =
  "noopener";


  buttons.appendChild(
    howDownload
  );


  /* ===================================================
     EXPLORE BUTTON
  =================================================== */

  const explore =
  document.createElement("a");


  explore.className =
  "btn explore";


  explore.textContent =
  "Explore";


  explore.href =
  window.location.pathname;


  buttons.appendChild(
    explore
  );


  /* ===================================================
     ADD CONTENT
  =================================================== */

  content.appendChild(
    title
  );


  content.appendChild(
    description
  );


  content.appendChild(
    buttons
  );


  /* ===================================================
     SCREENSHOTS
  =================================================== */

  if(
    Array.isArray(
      item.screenshot
    ) &&
    item.screenshot.length > 0
  ){

    const screenshotTitle =
    document.createElement("div");


    screenshotTitle.className =
    "screenshots-title";


    screenshotTitle.textContent =
    "Screenshots";


    const screenshots =
    document.createElement("div");


    screenshots.className =
    "screenshots";


    item.screenshot.forEach(
      function(url){

        const img =
        document.createElement("img");


        img.src =
        mediaUrl(url);


        img.alt =
        "Screenshot";


        screenshots.appendChild(
          img
        );

      }
    );


    content.appendChild(
      screenshotTitle
    );


    content.appendChild(
      screenshots
    );

  }


  detail.appendChild(
    content
  );


  app.appendChild(
    detail
  );

}


/* =====================================================
   LOAD JSON
===================================================== */

async function loadData(){

  const response =
  await fetch(
    DATA_URL,
    {
      method:"GET",
      cache:"no-store"
    }
  );


  if(!response.ok){

    throw new Error(
      "HTTP Error: " +
      response.status
    );

  }


  const data =
  await response.json();


  if(
    !data ||
    typeof data !== "object"
  ){

    throw new Error(
      "Invalid JSON"
    );

  }


  if(
    !Array.isArray(
      data.listMap
    )
  ){

    throw new Error(
      "listMap not found"
    );

  }


  if(
    typeof data.main !== "object"
  ){

    throw new Error(
      "main not found"
    );

  }


  if(
    typeof data.token !== "object"
  ){

    throw new Error(
      "token not found"
    );

  }


  return data;

}


/* =====================================================
   START
===================================================== */

async function start(){

  try{

    const data =
    await loadData();


    console.log(
      "Total listMap items:",
      data.listMap.length
    );


    const params =
    new URLSearchParams(
      window.location.search
    );


    const id =
    params.get("id");


    const token =
    params.get("s");


    /* =================================================
       ?id=ID
    ================================================= */

    if(id){

      renderPage2(
        data,
        "id",
        id
      );

      return;

    }


    /* =================================================
       ?s=TOKEN
    ================================================= */

    if(token){

      renderPage2(
        data,
        "token",
        token
      );

      return;

    }


    /* =================================================
       PAGE 1
    ================================================= */

    renderPage1(data);

  }catch(error){

    console.error(error);


    document.getElementById(
      "app"
    ).innerHTML =

    '<div class="error">' +

    '<h3>Something went wrong</h3>' +

    '<br>' +

    'JSON Load Error: ' +

    error.message +

    '</div>';

  }

}


start();

</script>

</body>
</html>
