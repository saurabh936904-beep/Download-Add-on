<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>Team✓Sniper™</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080808;
  color:#fff;
  min-height:100vh;
}

header{
  padding:22px 16px;
  text-align:center;
  border-bottom:1px solid #252525;
  background:linear-gradient(180deg,#151515,#090909);
}

.brand{
  color:#ffd700;
  font-size:28px;
  font-weight:800;
  cursor:pointer;
}

.handle{
  color:#888;
  margin-top:5px;
  font-size:14px;
}


/* =====================================================
   HEADER TITLE + SEARCH BUTTON
===================================================== */

.title-search-row{
  width:min(100%,900px);
  margin:0 auto;
  padding:0 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.page-title{
  font-size:22px;
  font-weight:800;
  color:#fff;
}


/* =====================================================
   SEARCH BUTTON
===================================================== */

.search-button{
  width:42px;
  height:42px;
  border:1px solid #333;
  border-radius:50%;
  background:#191919;
  color:#ffd700;
  font-size:21px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.search-button:hover{
  background:#252525;
  border-color:#ffd700;
}


/* =====================================================
   SEARCH BOX
===================================================== */

.search-box{
  width:min(100%,900px);
  margin:12px auto 0;
  padding:0 14px;
  display:none;
}

.search-box.active{
  display:block;
}

.search-input{
  width:100%;
  height:45px;
  border:1px solid #333;
  border-radius:10px;
  outline:none;
  background:#111;
  color:#fff;
  padding:0 14px;
  font-size:15px;
}

.search-input:focus{
  border-color:#ffd700;
}

.search-input::placeholder{
  color:#777;
}


/* =====================================================
   CONTAINER
===================================================== */

.container{
  width:min(100%,900px);
  margin:auto;
  padding:20px 14px 40px;
}

.loading{
  text-align:center;
  color:#aaa;
  padding:50px 10px;
}


/* =====================================================
   GRID
===================================================== */

.grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fill,minmax(170px,1fr));

  gap:16px;
}

.card{
  background:#111;
  border:1px solid #292929;
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#ffd700;
}

.card img{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  display:block;
  background:#222;
}

.card-title{
  padding:13px;
  font-size:15px;
  font-weight:bold;
}

.back{
  display:inline-block;
  color:#aaa;
  margin-bottom:15px;
  cursor:pointer;
}

.detail{
  background:#111;
  border:1px solid #292929;
  border-radius:18px;
  overflow:hidden;
}

.detail-main-img{
  width:100%;
  max-height:500px;
  object-fit:cover;
  display:block;
  cursor:pointer;
}

.detail-content{
  padding:18px;
}

.title{
  font-size:25px;
  font-weight:800;
  margin-bottom:10px;
}

.description{
  color:#bbb;
  line-height:1.6;
  margin-bottom:20px;
  white-space:pre-wrap;
}

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  border-radius:10px;
  padding:13px 20px;
  color:#fff;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
}

.download-green{
  background:#16a34a;
}

.download-red{
  background:#dc2626;
}

.how-download{
  background:#2563eb;
}

.how-download:hover{
  background:#1d4ed8;
}

.explore{
  background:#333;
}

.explore:hover{
  background:#444;
}


/* =====================================================
   SCREENSHOTS
===================================================== */

.screenshots-title{
  margin:25px 0 12px;
  font-size:19px;
}

.screenshots{
  display:grid;
  grid-template-columns:
  repeat(auto-fill,minmax(150px,1fr));

  gap:12px;
}

.screenshots img{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  border-radius:10px;
  background:#222;
}

.error{
  text-align:center;
  color:#ff5555;
  padding:50px 10px;
  line-height:1.6;
}


/* =====================================================
   NO SEARCH RESULT
===================================================== */

.no-result{
  text-align:center;
  color:#888;
  padding:50px 10px;
}

.no-result strong{
  color:#ffd700;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px){

  .grid{
    grid-template-columns:
    repeat(2,1fr);

    gap:10px;
  }

  .card-title{
    font-size:14px;
  }

  .title{
    font-size:21px;
  }

}

</style>

</head>


<body>


<header>

  <div
    class="brand"
    onclick="openChannel()">

    Team✓Sniper™

  </div>

  <div class="handle">
    @teamsniper450
  </div>

</header>


<!-- =====================================================
     PAGE TITLE + SEARCH BUTTON
===================================================== -->

<div class="title-search-row">

  <div class="page-title">
    Explore
  </div>

  <button
    class="search-button"
    id="searchButton"
    type="button"
    onclick="toggleSearch()">

    🔍

  </button>

</div>


<!-- =====================================================
     SEARCH BOX
===================================================== -->

<div
  class="search-box"
  id="searchBox">

  <input
    type="text"
    class="search-input"
    id="searchInput"
    placeholder="Search title or token..."
    autocomplete="off">

</div>


<div
  class="container"
  id="app">

  <div class="loading">
    Loading...
  </div>

</div>


<script>


/* =====================================================
   GITHUB GIST RAW JSON
===================================================== */

const DATA_URL =
"https://gist.githubusercontent.com/saurabh936904-beep/73067a85d4c453239c89d4f67a76ea7f/raw/database.json?v=" + new Date().getTime();


/* =====================================================
   DEFAULT HOW TO DOWNLOAD VIDEO
===================================================== */

const DEFAULT_HLINK =
"https://youtu.be/LM6_fEaCjyY";


/* =====================================================
   GLOBAL DATA
===================================================== */

let ALL_DATA = null;


/* =====================================================
   YOUTUBE ID
===================================================== */

function getYouTubeId(url){

  if(!url) return null;

  try{

    const u =
    new URL(url);

    if(
      u.hostname.includes("youtu.be")
    ){

      return u.pathname
      .substring(1)
      .split("/")[0];

    }

    if(
      u.hostname.includes("youtube.com")
    ){

      if(
        u.pathname === "/watch"
      ){

        return u.searchParams.get("v");

      }

      if(
        u.pathname.startsWith("/shorts/")
      ){

        return u.pathname
        .split("/")[2];

      }

      if(
        u.pathname.startsWith("/embed/")
      ){

        return u.pathname
        .split("/")[2];

      }

    }

  }catch(e){}

  return null;

}


/* =====================================================
   DRIVE ID
===================================================== */

function getDriveId(url){

  if(!url) return null;

  try{

    const match =
    url.match(
      /(?:\/d\/|id=)([a-zA-Z0-9_-]+)/
    );

    return match
    ? match[1]
    : null;

  }catch(e){

    return null;

  }

}


/* =====================================================
   MEDIA URL
===================================================== */

function mediaUrl(url){

  if(!url) return "";

  const youtubeId =
  getYouTubeId(url);

  if(youtubeId){

    return (
      "https://i.ytimg.com/vi/" +
      youtubeId +
      "/maxresdefault.jpg"
    );

  }

  return url;

}


/* =====================================================
   DOWNLOAD URL
===================================================== */

function downloadUrl(url){

  if(!url) return "";

  const youtubeId =
  getYouTubeId(url);

  if(youtubeId){

    return (
      "https://i.ytimg.com/vi/" +
      youtubeId +
      "/maxresdefault.jpg"
    );

  }

  const driveId =
  getDriveId(url);

  if(driveId){

    return (
      "https://drive.usercontent.google.com/download?id=" +
      encodeURIComponent(driveId) +
      "&export=download&confirm=t"
    );

  }

  return url;

}


/* =====================================================
   CHANNEL
===================================================== */

function openChannel(){

  window.location.href =
  "https://youtube.com/@teamsniper450";

}


/* =====================================================
   GET ITEMS
===================================================== */

function getItems(data){

  const result = [];

  const used =
  new Set();


  if(
    Array.isArray(data.listMap)
  ){

    data.listMap.forEach(
      function(item){

        if(
          !item ||
          !item.id
        ){

          return;

        }

        if(
          used.has(item.id)
        ){

          return;

        }

        used.add(item.id);

        result.push(item);

      }
    );

  }


  if(
    result.length === 0 &&
    data.main &&
    typeof data.main === "object"
  ){

    Object.keys(data.main)
    .forEach(
      function(id){

        const item =
        data.main[id];

        if(
          !item ||
          used.has(id)
        ){

          return;

        }

        used.add(id);

        result.push(item);

      }
    );

  }


  return result;

}


/* =====================================================
   SEARCH FILTER
===================================================== */

function filterItems(
  items,
  searchText
){

  /*
     Case-insensitive search.

     Example:

     Minecraft
     minecraft
     MINECRAFT

     सभी same माने जाएंगे।
  */

  const query =
  String(searchText || "")
  .trim()
  .toLowerCase();


  if(!query){

    return items;

  }


  return items.filter(
    function(item){

      const title =
      String(
        item.title || ""
      )
      .toLowerCase();


      const token =
      String(
        item.token || ""
      )
      .toLowerCase();


      /*
         TITLE OR TOKEN MATCH
      */

      return (
        title.includes(query) ||
        token.includes(query)
      );

    }
  );

}


/* =====================================================
   RENDER SEARCH RESULT
===================================================== */

function renderSearchResults(
  searchText
){

  if(!ALL_DATA){

    return;

  }


  const items =
  getItems(ALL_DATA);


  const filtered =
  filterItems(
    items,
    searchText
  );


  renderItems(
    filtered,
    searchText
  );

}


/* =====================================================
   RENDER ITEM GRID
===================================================== */

function renderItems(
  items,
  searchText
){

  const app =
  document.getElementById("app");


  app.innerHTML = "";


  if(items.length === 0){

    const noResult =
    document.createElement("div");

    noResult.className =
    "no-result";


    noResult.innerHTML =
    'No result found for <strong>"' +
    escapeHtml(searchText || "") +
    '"</strong>';


    app.appendChild(
      noResult
    );

    return;

  }


  const grid =
  document.createElement("div");

  grid.className =
  "grid";


  items.forEach(
    function(item){

      const card =
      document.createElement("div");

      card.className =
      "card";


      const img =
      document.createElement("img");


      img.src =
      mediaUrl(
        item.thumbnail
      );


      img.alt =
      item.title ||
      "Thumbnail";


      const title =
      document.createElement("div");

      title.className =
      "card-title";


      title.textContent =
      item.title ||
      "Untitled";


      card.appendChild(img);

      card.appendChild(title);


      card.addEventListener(
        "click",
        function(){

          if(
            !item.token
          ){

            return;

          }


          window.location.href =
          "?s=" +
          encodeURIComponent(
            item.token
          );

        }
      );


      grid.appendChild(card);

    }
  );


  app.appendChild(grid);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   PAGE 1
===================================================== */

function renderPage1(data){

  const app =
  document.getElementById("app");


  app.innerHTML = "";


  const items =
  getItems(data);


  if(items.length === 0){

    app.innerHTML =
    '<div class="error">' +
    'No items found.' +
    '</div>';

    return;

  }


  renderItems(
    items,
    ""
  );

}


/* =====================================================
   FIND ITEM BY ID
===================================================== */

function findItemById(
  data,
  id
){

  const items =
  getItems(data);


  for(
    let i = 0;
    i < items.length;
    i++
  ){

    if(
      items[i].id === id
    ){

      return items[i];

    }

  }


  if(
    data.main &&
    data.main[id]
  ){

    return data.main[id];

  }


  return null;

}


/* =====================================================
   FIND ITEM BY TOKEN
===================================================== */

function findItemByToken(
  data,
  token
){

  const items =
  getItems(data);


  for(
    let i = 0;
    i < items.length;
    i++
  ){

    if(
      items[i].token === token
    ){

      return items[i];

    }

  }


  if(
    data.token &&
    data.token[token]
  ){

    return findItemById(
      data,
      data.token[token]
    );

  }


  return null;

}


/* =====================================================
   PAGE 2
===================================================== */

function renderPage2(
  data,
  type,
  value
){

  const app =
  document.getElementById("app");


  let item = null;

  let isTokenLink =
  false;


  if(
    type === "id"
  ){

    item =
    findItemById(
      data,
      value
    );

  }


  if(
    type === "token"
  ){

    item =
    findItemByToken(
      data,
      value
    );

    isTokenLink =
    true;

  }


  if(!item){

    renderPage1(data);

    return;

  }


  app.innerHTML = "";


  const back =
  document.createElement("div");

  back.className =
  "back";

  back.textContent =
  "← Explore";


  back.onclick =
  function(){

    window.location.href =
    window.location.pathname;

  };


  app.appendChild(back);


  const detail =
  document.createElement("div");

  detail.className =
  "detail";


  const mainImg =
  document.createElement("img");

  mainImg.className =
  "detail-main-img";


  mainImg.src =
  mediaUrl(
    item.thumbnail
  );


  mainImg.alt =
  item.title ||
  "Thumbnail";


  mainImg.onclick =
  function(){

    if(
      item.Vlink
    ){

      window.open(
        item.Vlink,
        "_blank"
      );

    }

  };


  detail.appendChild(
    mainImg
  );


  const content =
  document.createElement("div");

  content.className =
  "detail-content";


  const title =
  document.createElement("div");

  title.className =
  "title";

  title.textContent =
  item.title ||
  "Untitled";


  const description =
  document.createElement("div");

  description.className =
  "description";

  description.textContent =
  item.description ||
  "";


  const buttons =
  document.createElement("div");

  buttons.className =
  "buttons";


  const download =
  document.createElement("a");


  if(
    isTokenLink
  ){

    download.className =
    "btn download-red";

    download.textContent =
    "Download Now";

    download.href =
    downloadUrl(
      item.Slink
    );

  }else{

    download.className =
    "btn download-green";

    download.textContent =
    "Download Now";

    download.href =
    downloadUrl(
      item.link
    );

  }


  download.target =
  "_blank";

  download.rel =
  "noopener";


  buttons.appendChild(
    download
  );


  const howDownload =
  document.createElement("a");


  howDownload.className =
  "btn how-download";

  howDownload.textContent =
  "How to Download";


  let howToLink =
    DEFAULT_HLINK;


  if(
    typeof item.Hlink === "string" &&
    item.Hlink.trim() !== ""
  ){

    howToLink =
    item.Hlink.trim();

  }


  howDownload.href =
  howToLink;

  howDownload.target =
  "_blank";

  howDownload.rel =
  "noopener";


  buttons.appendChild(
    howDownload
  );


  const explore =
  document.createElement("a");


  explore.className =
  "btn explore";

  explore.textContent =
  "Explore";

  explore.href =
  window.location.pathname;


  buttons.appendChild(
    explore
  );


  content.appendChild(
    title
  );

  content.appendChild(
    description
  );

  content.appendChild(
    buttons
  );


  if(
    Array.isArray(
      item.screenshot
    ) &&
    item.screenshot.length > 0
  ){

    const screenshotTitle =
    document.createElement("div");


    screenshotTitle.className =
    "screenshots-title";


    screenshotTitle.textContent =
    "Screenshots";


    const screenshots =
    document.createElement("div");


    screenshots.className =
    "screenshots";


    item.screenshot.forEach(
      function(url){

        const img =
        document.createElement("img");


        img.src =
        mediaUrl(url);


        img.alt =
        "Screenshot";


        screenshots.appendChild(
          img
        );

      }
    );


    content.appendChild(
      screenshotTitle
    );


    content.appendChild(
      screenshots
    );

  }


  detail.appendChild(
    content
  );


  app.appendChild(
    detail
  );

}


/* =====================================================
   SEARCH BUTTON
===================================================== */

function toggleSearch(){

  const searchBox =
  document.getElementById(
    "searchBox"
  );

  const searchInput =
  document.getElementById(
    "searchInput"
  );


  searchBox.classList.toggle(
    "active"
  );


  if(
    searchBox.classList.contains(
      "active"
    )
  ){

    searchInput.focus();

  }else{

    searchInput.value = "";

    if(ALL_DATA){

      renderPage1(
        ALL_DATA
      );

    }

  }

}


/* =====================================================
   LIVE SEARCH
===================================================== */

document
.getElementById("searchInput")
.addEventListener(
  "input",
  function(){

    renderSearchResults(
      this.value
    );

  }
);


/* =====================================================
   LOAD JSON
===================================================== */

async function loadData(){

  const response =
  await fetch(
    DATA_URL,
    {
      method:"GET",
      cache:"no-store"
    }
  );


  if(!response.ok){

    throw new Error(
      "HTTP Error: " +
      response.status
    );

  }


  const data =
  await response.json();


  if(
    !data ||
    typeof data !== "object"
  ){

    throw new Error(
      "Invalid JSON"
    );

  }


  if(
    !Array.isArray(
      data.listMap
    )
  ){

    throw new Error(
      "listMap not found"
    );

  }


  if(
    typeof data.main !== "object"
  ){

    throw new Error(
      "main not found"
    );

  }


  if(
    typeof data.token !== "object"
  ){

    throw new Error(
      "token not found"
    );

  }


  return data;

}


/* =====================================================
   START
===================================================== */

async function start(){

  try{

    const data =
    await loadData();


    ALL_DATA =
    data;


    console.log(
      "Total listMap items:",
      data.listMap.length
    );


    const params =
    new URLSearchParams(
      window.location.search
    );


    const id =
    params.get("id");


    const token =
    params.get("s");


    if(id){

      renderPage2(
        data,
        "id",
        id
      );

      return;

    }


    if(token){

      renderPage2(
        data,
        "token",
        token
      );

      return;

    }


    renderPage1(
      data
    );

  }catch(error){

    console.error(error);


    document.getElementById(
      "app"
    ).innerHTML =

    '<div class="error">' +

    '<h3>Something went wrong</h3>' +

    '<br>' +

    'JSON Load Error: ' +

    error.message +

    '</div>';

  }

}


start();

</script>

</body>
</html>
