<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080808;
  color:#fff;
  min-height:100vh;
}

header{
  padding:22px 16px;
  text-align:center;
  border-bottom:1px solid #252525;
  background:linear-gradient(180deg,#151515,#090909);
}

.brand{
  color:#ffd700;
  font-size:28px;
  font-weight:800;
  cursor:pointer;
}

.handle{
  color:#888;
  margin-top:5px;
  font-size:14px;
}

.container{
  width:min(100%,900px);
  margin:auto;
  padding:20px 14px 40px;
}

.loading{
  text-align:center;
  color:#aaa;
  padding:50px 10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:16px;
}

.card{
  background:#111;
  border:1px solid #292929;
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#ffd700;
}

.card img{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  display:block;
  background:#222;
}

.card-title{
  padding:13px;
  font-size:15px;
  font-weight:bold;
}

.back{
  display:inline-block;
  color:#aaa;
  margin-bottom:15px;
  cursor:pointer;
}

.detail{
  background:#111;
  border:1px solid #292929;
  border-radius:18px;
  overflow:hidden;
}

.detail-main-img{
  width:100%;
  max-height:500px;
  object-fit:cover;
  display:block;
  cursor:pointer;
}

.detail-content{
  padding:18px;
}

.title{
  font-size:25px;
  font-weight:800;
  margin-bottom:10px;
}

.description{
  color:#bbb;
  line-height:1.6;
  margin-bottom:20px;
  white-space:pre-wrap;
}

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  border-radius:10px;
  padding:13px 20px;
  color:#fff;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
}

.download-green{
  background:#16a34a;
}

.download-red{
  background:#dc2626;
}

.explore{
  background:#333;
}

.screenshots-title{
  margin:25px 0 12px;
  font-size:19px;
}

.screenshots{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:12px;
}

.screenshots img{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  border-radius:10px;
  background:#222;
}

.error{
  text-align:center;
  color:#ff5555;
  padding:50px 10px;
}

@media(max-width:500px){

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .card-title{
    font-size:14px;
  }

  .title{
    font-size:21px;
  }

}

/* =====================================================
   YOUTUBE VIDEO ID
===================================================== */

function getYouTubeId(url){

  if(!url) return null;

  try{

    const u =
    new URL(url);

    if(
      u.hostname.includes("youtu.be")
    ){

      return u.pathname
      .substring(1)
      .split("/")[0];

    }


    if(
      u.hostname.includes("youtube.com")
    ){

      if(
        u.pathname === "/watch"
      ){

        return u.searchParams.get("v");

      }


      if(
        u.pathname.startsWith("/shorts/")
      ){

        return u.pathname
        .split("/")[2];

      }


      if(
        u.pathname.startsWith("/embed/")
      ){

        return u.pathname
        .split("/")[2];

      }

    }

  }catch(e){}

  return null;
}


/* =====================================================
   DRIVE ID
===================================================== */

function getDriveId(url){

  if(!url) return null;

  try{

    const match =
    url.match(
      /(?:\/d\/|id=)([a-zA-Z0-9_-]+)/
    );

    return match
    ? match[1]
    : null;

  }catch(e){

    return null;

  }
}


/* =====================================================
   MEDIA URL
===================================================== */

function mediaUrl(url){

  if(!url) return "";

  const youtubeId =
  getYouTubeId(url);


  if(youtubeId){

    return (
      "https://i.ytimg.com/vi/" +
      youtubeId +
      "/maxresdefault.jpg"
    );

  }


  return url;
}


/* =====================================================
   DOWNLOAD URL
===================================================== */

function downloadUrl(url){

  if(!url) return "";

  const youtubeId =
  getYouTubeId(url);


  if(youtubeId){

    return (
      "https://i.ytimg.com/vi/" +
      youtubeId +
      "/maxresdefault.jpg"
    );

  }


  const driveId =
  getDriveId(url);


  if(driveId){

    return (
      "https://drive.usercontent.google.com/download?id=" +
      encodeURIComponent(driveId) +
      "&export=download&confirm=t"
    );

  }


  return url;
}


/* =====================================================
   YOUTUBE CHANNEL
===================================================== */

/* =====================================================
   PAGE 1
===================================================== */

function renderPage1(data){

  const app =
  document.getElementById("app");

  app.innerHTML = "";


  const grid =
  document.createElement("div");

  grid.className =
  "grid";


  const main =
  data.main || {};


  const ids =
  Object.keys(main);


  if(ids.length === 0){

    app.innerHTML =
    '<div class="error">No items found.</div>';

    return;

  }


  ids.forEach(function(id){

    const item =
    main[id];


    const card =
    document.createElement("div");

    card.className =
    "card";


    const img =
    document.createElement("img");

    img.src =
    mediaUrl(item.thumbnail);

    img.alt =
    item.title || "Thumbnail";


    const title =
    document.createElement("div");

    title.className =
    "card-title";

    title.textContent =
    item.title || "Untitled";


    card.appendChild(img);

    card.appendChild(title);


    /*
      PAGE 1 → PAGE 2

      ONLY TOKEN

      ?s=TOKEN
    */

    card.addEventListener(
      "click",
      function(){

        if(!item.token){
          return;
        }


        window.location.href =
        "?s=" +
        encodeURIComponent(
          item.token
        );

      }
    );


    grid.appendChild(card);

  });


  app.appendChild(grid);

}


/* =====================================================
   PAGE 2
===================================================== */

function renderPage2(
  data,
  type,
  value
){

  const app =
  document.getElementById("app");


  let id = null;

  let isTokenLink = false;


  /* ===================================================
     ?id=ID
  =================================================== */

  if(type === "id"){

    const main =
    data.main || {};


    if(main[value]){

      id = value;

    }else{

      renderPage1(data);

      return;

    }

  }


  /* ===================================================
     ?s=TOKEN
  =================================================== */

  if(type === "token"){

    const tokenMap =
    data.token || {};


    id =
    tokenMap[value];


    if(!id){

      renderPage1(data);

      return;

    }


    isTokenLink = true;

  }


  /* ===================================================
     ITEM
  =================================================== */

  const item =
  data.main &&
  data.main[id];


  if(!item){

    renderPage1(data);

    return;

  }


  app.innerHTML = "";


  /* ===================================================
     EXPLORE
  =================================================== */

  const back =
  document.createElement("div");

  back.className =
  "back";

  back.textContent =
  "← Explore";


  back.onclick =
  function(){

    window.location.href =
    window.location.pathname;

  };


  app.appendChild(back);


  /* ===================================================
     DETAIL
  =================================================== */

  const detail =
  document.createElement("div");

  detail.className =
  "detail";


  /* ===================================================
     MAIN THUMBNAIL
  =================================================== */

  const mainImg =
  document.createElement("img");

  mainImg.className =
  "detail-main-img";

  mainImg.src =
  mediaUrl(
    item.thumbnail
  );

  mainImg.alt =
  item.title || "Thumbnail";


  mainImg.onclick =
  function(){

    if(item.Vlink){

      window.open(
        item.Vlink,
        "_blank"
      );

    }

  };


  detail.appendChild(
    mainImg
  );


  /* ===================================================
     CONTENT
  =================================================== */

  const content =
  document.createElement("div");

  content.className =
  "detail-content";


  /* TITLE */

  const title =
  document.createElement("div");

  title.className =
  "title";

  title.textContent =
  item.title || "Untitled";


  /* DESCRIPTION */

  const description =
  document.createElement("div");

  description.className =
  "description";

  description.textContent =
  item.description || "";


  /* ===================================================
     BUTTONS
  =================================================== */

  const buttons =
  document.createElement("div");

  buttons.className =
  "buttons";


  const download =
  document.createElement("a");


  /*
     ?id=ID
     GREEN
     item.link

     ?s=TOKEN
     RED
     item.Slink
  */

  if(isTokenLink){

    download.className =
    "btn download-red";

    download.textContent =
    "Download Now";

    download.href =
    downloadUrl(
      item.Slink
    );

  }else{

    download.className =
    "btn download-green";

    download.textContent =
    "Download Now";

    download.href =
    downloadUrl(
      item.link
    );

  }


  download.target =
  "_blank";

  download.rel =
  "noopener";


  /* EXPLORE */

  const explore =
  document.createElement("a");

  explore.className =
  "btn explore";

  explore.textContent =
  "Explore";

  explore.href =
  window.location.pathname;


  buttons.appendChild(
    download
  );

  buttons.appendChild(
    explore
  );


  content.appendChild(
    title
  );

  content.appendChild(
    description
  );

  content.appendChild(
    buttons
  );


  /* ===================================================
     SCREENSHOTS
  =================================================== */

  if(
    Array.isArray(
      item.screenshot
    ) &&
    item.screenshot.length > 0
  ){

    const screenshotTitle =
    document.createElement("div");

    screenshotTitle.className =
    "screenshots-title";

    screenshotTitle.textContent =
    "Screenshots";


    const screenshots =
    document.createElement("div");

    screenshots.className =
    "screenshots";


    item.screenshot.forEach(
      function(url){

        const img =
        document.createElement("img");

        img.src =
        mediaUrl(url);

        img.alt =
        "Screenshot";


        screenshots.appendChild(
          img
        );

      }
    );


    content.appendChild(
      screenshotTitle
    );

    content.appendChild(
      screenshots
    );

  }


  detail.appendChild(
    content
  );


  app.appendChild(
    detail
  );

}


/* =====================================================
   LOAD JSON
===================================================== */

async function loadData(){

  try{

    const response =
    await fetch(
      DATA_URL,
      {
        method:"GET",
        cache:"no-store"
      }
    );


    if(!response.ok){

      throw new Error(
        "Drive fetch failed: HTTP " +
        response.status
      );

    }


    const data =
    await response.json();


    if(
      !data ||
      typeof data.main !== "object" ||
      typeof data.token !== "object"
    ){

      throw new Error(
        "Invalid JSON structure"
      );

    }


    console.log(
      "Live JSON loaded successfully."
    );


    return data;


  }catch(error){

    console.log(
      "Google Drive read failed:",
      error
    );


    /*
       IMPORTANT:
       Live JSON fail hone par
       current fallback data use hoga.
    */

    return fallbackData;

  }

}


/* =====================================================
   ROUTER
===================================================== */

async function start(){

  const data =
  await loadData();


  const params =
  new URLSearchParams(
    window.location.search
  );


  const id =
  params.get("id");


  const token =
  params.get("s");


  /* ===================================================
     ID
  =================================================== */

  if(id){

    renderPage2(
      data,
      "id",
      id
    );

    return;

  }


  /* ===================================================
     TOKEN
  =================================================== */

  if(token){

    renderPage2(
      data,
      "token",
      token
    );

    return;

  }


  /* ===================================================
     PAGE 1
  =================================================== */

  renderPage1(data);

}


/* =====================================================
   START
===================================================== */

start();
